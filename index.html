<header class="top">

  <span class="badge">数据已脱敏 · 虚构语料 · 无原声不回答</span>

<main>
  <p class="hint">理想 VOC Agent 全栈（与 98008 独立）。架构：<a href="https://annawzhang.github.io/people-product-handbook/sections/11-voc-agent.html">手册 §11</a> · 口径：<a href="https://github.com/annawzhang/voc-insight-kit">Insight Kit</a>。无原声引用则拒答。</p>
  <div class="log" id="log"></div>
  <form class="composer" id="form">
    <input id="q" placeholder="例如：A9 的价格心理关口是多少？ / 生成续航议题四步话术 / 检查：一定升值零故障" autocomplete="off"/>
    <button type="submit">发送</button>
  </form>
</main>
